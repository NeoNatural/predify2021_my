[project]
root = ".."

[paths]
imagenet_root = "__SET_IMAGENET_ROOT__"
sample_file = "Hebbian-CNN/Log/DatasetSample/N_Back-1.pckl"
output_dir = "Hebbian-CNN/Log/foveated_v1/nohebb"
pcoder_weight_dir = "predify2021/model_factory"
fc_checkpoint = ""

[runtime]
device = "auto"
seed = 114514
max_time_steps = 10
reduced_time_steps = 2
max_samples = 2000

[model]
name = "pvgg"
pretrained_pcoders = true
random_init = true
fc_weight_source = "torchvision"
fc_hebb_compute_enabled = true
original_mode = true

[[model.hyperparameters]]
ffm = 0.8
fbm = 0.1
erm = 0.01
[[model.hyperparameters]]
ffm = 0.8
fbm = 0.1
erm = 0.01
[[model.hyperparameters]]
ffm = 0.8
fbm = 0.1
erm = 0.01
[[model.hyperparameters]]
ffm = 0.8
fbm = 0.1
erm = 0.01
[[model.hyperparameters]]
ffm = 0.8
fbm = 0.1
erm = 0.01

[stimulus]
prime_layout = "foveated_full"
canvas_scale = 2.0
contrast_scale = 0.5
blur_sigma = 1.0
downsample_after_blur = true
degradation_seed = 0
fractal_octaves = 3

[[stimulus.degradations]]
mode = "none"
levels = [0.0]
[[stimulus.degradations]]
mode = "predify_noise"
levels = [0.5]
[[stimulus.degradations]]
mode = "fractal_occlusion"
levels = [0.3]

[experiment]
task_name = "N_Back-"
gap = 1
run_priming = true
run_nonpriming = true
representation_class_items = 400
